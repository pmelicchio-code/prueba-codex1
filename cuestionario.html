<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuestionario sobre Uso de IA en el Desarrollo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container my-5">
    <div class="card shadow-lg rounded-4">
      <div class="card-body p-5">
        <h2 class="text-center mb-4">🧠 Cuestionario: Uso de Inteligencia Artificial en el Desarrollo</h2>
        <p class="text-muted text-center mb-5">Por favor, completá este breve formulario para conocer cómo utilizás la IA en tus tareas de desarrollo.</p>

        <form>
          <!-- 1 -->
          <div class="mb-4">
            <label class="form-label fw-bold">1. En una escala del 1 al 5, ¿cómo evaluarías tu nivel de conocimiento sobre IA aplicada al desarrollo?</label>
            <select class="form-select" required>
              <option value="">Seleccioná una opción</option>
              <option>1 - Muy bajo</option>
              <option>2 - Bajo</option>
              <option>3 - Intermedio</option>
              <option>4 - Alto</option>
              <option>5 - Experto</option>
            </select>
          </div>

          <!-- 2 -->
          <div class="mb-4">
            <label class="form-label fw-bold">2. ¿Usás actualmente alguna herramienta impulsada por IA en tu trabajo diario?</label>
            <input type="text" class="form-control" placeholder="Ejemplo: GitHub Copilot, ChatGPT, Tabnine, etc.">
          </div>

          <!-- 3 -->
          <div class="mb-4">
            <label class="form-label fw-bold">3. ¿Con qué frecuencia utilizás herramientas de IA durante el desarrollo?</label>
            <select class="form-select">
              <option value="">Seleccioná una opción</option>
              <option>Nunca</option>
              <option>Ocasionalmente</option>
              <option>Varias veces por semana</option>
              <option>A diario</option>
            </select>
          </div>

          <!-- 4 -->
          <div class="mb-4">
            <label class="form-label fw-bold">4. ¿En qué tipo de tareas usás IA con mayor frecuencia?</label>
            <textarea class="form-control" rows="2" placeholder="Ejemplo: generación de código, testing, documentación..."></textarea>
          </div>

          <!-- 5 -->
          <div class="mb-4">
            <label class="form-label fw-bold">5. ¿En qué medida creés que la IA ha mejorado tu productividad o calidad del código?</label>
            <select class="form-select">
              <option value="">Seleccioná una opción</option>
              <option>Nada</option>
              <option>Poco</option>
              <option>Moderadamente</option>
              <option>Mucho</option>
              <option>De forma significativa</option>
            </select>
          </div>

          <!-- 6 -->
          <div class="mb-4">
            <label class="form-label fw-bold">6. ¿Qué obstáculos encontrás al usar IA en el desarrollo?</label>
            <textarea class="form-control" rows="2" placeholder="Ejemplo: precisión, seguridad, políticas internas..."></textarea>
          </div>

          <!-- 7 -->
          <div class="mb-4">
            <label class="form-label fw-bold">7. ¿Considerás que la IA está integrada formalmente en el flujo de trabajo del equipo?</label>
            <select class="form-select">
              <option value="">Seleccioná una opción</option>
              <option>No, en absoluto</option>
              <option>Parcialmente</option>
              <option>Sí, en algunos procesos</option>
              <option>Totalmente integrada</option>
            </select>
          </div>

          <!-- 8 -->
          <div class="mb-4">
            <label class="form-label fw-bold">8. ¿Has recibido o te gustaría recibir capacitación sobre el uso de IA en el desarrollo?</label>
            <select class="form-select">
              <option value="">Seleccioná una opción</option>
              <option>No me interesa</option>
              <option>Me gustaría recibir capacitación</option>
              <option>Ya recibí alguna formación</option>
            </select>
          </div>

          <!-- 9 -->
          <div class="mb-4">
            <label class="form-label fw-bold">9. ¿Tenés en cuenta consideraciones éticas o de privacidad al usar IA para generar o revisar código?</label>
            <select class="form-select">
              <option value="">Seleccioná una opción</option>
              <option>Nunca</option>
              <option>A veces</option>
              <option>Siempre</option>
            </select>
          </div>

          <!-- 10 -->
          <div class="mb-4">
            <label class="form-label fw-bold">10. ¿Qué nivel de importancia creés que tendrá la IA en el trabajo del equipo durante los próximos 2 años?</label>
            <select class="form-select">
              <option value="">Seleccioná una opción</option>
              <option>Nula</option>
              <option>Moderada</option>
              <option>Alta</option>
              <option>Transformacional</option>
            </select>
          </div>

          <div class="text-center mt-5">
            <button type="submit" class="btn btn-primary btn-lg px-5">Enviar respuestas</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
